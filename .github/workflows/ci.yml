name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispotruck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dispotruck_test
      JWT_SECRET: secret_de_test_ci

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations Prisma
        run: pnpm exec prisma migrate deploy
        working-directory: backend

      - name: Lancer les tests backend
        run: pnpm test
        working-directory: backend

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Lancer le lint frontend
        run: pnpm run lint
        working-directory: frontend
